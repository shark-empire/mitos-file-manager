name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-check-build-test:
    name: fmt / check / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Remove this block if the crate is at the repository root.
    defaults:
      run:
        working-directory: mitos-file-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            xdg-utils \
            xvfb

      - name: Install Rust stable with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup show

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        # If your crate is at the repository root, remove this with block.
        with:
          workspaces: |
            mitos-file-manager

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --all-targets --all-features
        
      - name: Install clippy
        run: rustup component add clippy

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Run tests
        run: xvfb-run -a cargo test --all-targets --all-features
