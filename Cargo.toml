[package]
name = "mitos-file-manager"
version = "0.1.0"
edition = "2021"
authors = ["Shark <banor3331@gmail.com>"]
description = "MITOS Files — file manager for the MITOS desktop"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
trash = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
notify = "6.1"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
zbus = { version = "4", default-features = false, features = ["blocking-api"] }

