[package]
name = "mitos-file-manager"
version = "0.1.0"
edition = "2021"
authors = ["Shark <banor3331@gmail.com>"]
description = "MITOS Files — file manager for the MITOS desktop"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
async-channel = "2"
trash = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
notify = "6.1"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
libc = "0.2"
zbus = { version = "4", features = ["blocking"] }
mitos-utils = { git = "https://github.com/shark-empire/mitos-utils"}

# A smaller binary is a smaller memory footprint: thin LTO and one codegen
# unit let the compiler drop what's unused, and stripping debug info keeps it
# out of the mapped image. (Panics still unwind, so a crashed worker thread
# doesn't take the whole window with it.)
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
